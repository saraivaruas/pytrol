# Manifest para la solicitud a Flathub (PR a github.com/flathub/flathub, rama new-pr).
# Compila desde la etiqueta publicada en GitHub.
app-id: io.github.saraivaruas.Pytrol
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pytrol
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Pytrol es un emulador de terminal: ejecuta el shell del sistema anfitrión
  # con flatpak-spawn --host (igual que Ptyxis, Black Box o Tilix en Flathub).
  - --talk-name=org.freedesktop.Flatpak
  # Para el diálogo "Abrir proyecto" (elegir carpetas del usuario).
  - --filesystem=home
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala
  - '*.la'
  - '*.a'
modules:
  # Dependencias de VTE que el SDK de GNOME no incluye.
  - name: simdutf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DSIMDUTF_TESTS=OFF
      - -DSIMDUTF_TOOLS=OFF
      - -DSIMDUTF_BENCHMARKS=OFF
    sources:
      - type: archive
        url: https://github.com/simdutf/simdutf/archive/refs/tags/v9.3.3.tar.gz
        sha256: 441e374e8629bd8469f6d5cde9f0fa17ef3ad158aeb077791606d8aa73b565ef

  - name: fast_float
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFASTFLOAT_INSTALL=ON
      - -DFASTFLOAT_TEST=OFF
      - -DFASTFLOAT_SANITIZE=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.3.3.tar.gz
        sha256: 4dd695f051893c8218faf2ed9871fa4a4990aa6aee2d3190ed7bfa2e83092245

  # El runtime de GNOME no incluye VTE; se compila la variante GTK 3.
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=true
      - -Dgtk4=false
      - -Dgir=true
      - -Dvapi=false
      - -Ddocs=false
      - -D_systemd=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.84.1/vte-0.84.1.tar.gz
        sha256: 9f73468982a339cd1eb942beb7d348a5564c9ed48473ad1690c791f8474916ec

  # Editor integrado: GtkSourceView 4 (variante GTK 3; el runtime solo trae la 5, para GTK 4).
  - name: gtksourceview
    buildsystem: meson
    config-opts:
      - -Dgir=true
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dglade_catalog=false
      - -Dinstall_tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz
        sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d

  - name: pytrol
    buildsystem: simple
    build-commands:
      - install -Dm755 pytrol.py /app/bin/pytrol
      - install -Dm644 data/io.github.saraivaruas.Pytrol.desktop /app/share/applications/io.github.saraivaruas.Pytrol.desktop
      - install -Dm644 data/io.github.saraivaruas.Pytrol.metainfo.xml /app/share/metainfo/io.github.saraivaruas.Pytrol.metainfo.xml
      - install -Dm644 data/icons/io.github.saraivaruas.Pytrol.svg /app/share/icons/hicolor/scalable/apps/io.github.saraivaruas.Pytrol.svg
    sources:
      - type: git
        url: https://github.com/saraivaruas/pytrol.git
        tag: v0.6.0
        commit: 3397c28e37eea012c1d2628fe8e3dcebd1103f3f
