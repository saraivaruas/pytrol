name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Dependencias (PyGObject, GTK 3, VTE, GtkSourceView 4 y una pantalla virtual)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-gtksource-4 xvfb xdotool
      - name: Sintaxis
        run: python3 -m py_compile pytrol.py
      - name: Pruebas
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: La aplicación abre y se mantiene
        run: |
          export PYTROL_CONFIG_DIR="$(mktemp -d)"
          set +e
          xvfb-run -a timeout 8 python3 pytrol.py
          # 124 = sigue ejecutándose cuando vence el tiempo: arrancó bien
          test $? -eq 124
